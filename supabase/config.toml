# Minimal Supabase CLI config for Cookwise.
# Only the settings the app actually depends on are declared here; everything
# else falls back to the CLI defaults. See https://supabase.com/docs/guides/local-development/cli/config

project_id = "cookwise"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Local mail catcher — email OTP codes show up here during development.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Cookwise signs in with a 6-digit email OTP rather than a magic link.
otp_length = 6
otp_expiry = 3600
